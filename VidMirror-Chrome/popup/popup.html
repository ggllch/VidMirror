<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidMirror</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="container">
      <h1>VidMirror</h1>
      <section class="controlPanel">
        <div class="switchRow">
          <span class="switchLabel">Mirror current tab</span>
          <label class="switch" for="enabledToggle">
            <input id="enabledToggle" type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>
        <p id="status" class="statusBadge is-enabled">Active</p>
        <p id="statusHint" class="statusHint">Mirroring is currently enabled.</p>
      </section>
      <section class="bottomBar">
        <span id="versionLabel" class="versionLabel"></span>
        <div class="donateArea">
          <span class="donateHint">Support me</span>
          <a
            class="donateButton"
            href="https://www.donationalerts.com/r/11ch"
            target="_blank"
            rel="noopener noreferrer"
          >
            Donate
          </a>
        </div>
      </section>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
